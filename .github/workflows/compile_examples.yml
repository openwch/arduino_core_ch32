name: Compile Library Examples with arduino_core_ch32

on:
  workflow_dispatch: # Enables the manual "Run workflow" button
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Custom Core
        uses: actions/checkout@v7
        with:
          path: arduino_core_ch32
          submodules: recursive

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Build_examples.py selects the checkout as a local platform.
      # The installed package only supplies compiler tools and dependencies.
      - name: Install CH32 compiler tools and dependencies
        run: |
          arduino-cli core install ch32-community:ch32v --additional-urls https://github.com/ch32-community/board_manager_files/raw/main/package_ch32v_index.json

      - name: CH32L10x - Compile Sketches
        if: '!cancelled()'
        run: python3 ./arduino_core_ch32/tools/build_examples.py CH32L10x

      - name: CH32V00x - Compile Sketches
        if: '!cancelled()'
        run: python3 ./arduino_core_ch32/tools/build_examples.py CH32V00x

      - name: CH32V10x - Compile Sketches
        if: '!cancelled()'
        run: python3 ./arduino_core_ch32/tools/build_examples.py CH32V10x

      - name: CH32V20x - Compile Sketches
        if: '!cancelled()'
        run: python3 ./arduino_core_ch32/tools/build_examples.py CH32V20x

      - name: CH32V30x - Compile Sketches
        if: '!cancelled()'
        run: python3 ./arduino_core_ch32/tools/build_examples.py CH32V30x

      - name: CH32VM00X - Compile Sketches
        if: '!cancelled()'
        run: python3 ./arduino_core_ch32/tools/build_examples.py CH32VM00X

      - name: CH32X035 - Compile Sketches
        if: '!cancelled()'
        run: python3 ./arduino_core_ch32/tools/build_examples.py CH32X035

      - name: Miscellaneous - Compile Sketches
        if: '!cancelled()'
        run: python3 ./arduino_core_ch32/tools/build_examples.py Miscellaneous
